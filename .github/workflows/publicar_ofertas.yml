# Hadouken Zone - publicación automática en Telegram (GitHub Actions)
#
# Cada 30 minutos entre las 09:07 y las 23:07 (hora de Madrid) ejecuta una pasada del bot
# (python main.py --ciclo):
#   - 09:07: mensaje de buenos días con imagen
#   - cada pasada: busca ofertas nuevas en las fuentes (OFFER_SOURCES, por defecto Chollometro)
#     y publica todas las válidas, con 60 s entre ofertas
#
# El historial de ofertas publicadas y el estado se guardan en la rama "estado",
# para no repetir ofertas ni el buenos días entre ejecuciones.
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Ejecución manual: pestaña Actions > "Publicar ofertas" > Run workflow
#   (por defecto en DRY_RUN: muestra el resultado en el registro sin publicar).

name: Publicar ofertas

on:
  schedule:
    # En UTC (sin depender de "timezone:"): cubre 09:07-23:07 de Madrid en invierno (UTC+1)
    # y en verano (UTC+2). El bot decide con la hora de Madrid si toca publicar; las pasadas
    # fuera de horario terminan en segundos sin hacer nada.
    - cron: "7,37 7-21 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulación: true = no publica nada en Telegram"
        type: choice
        options: ["true", "false"]
        default: "true"

concurrency:
  group: publicar-ofertas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      # Afiliación desactivada hasta nuevo aviso (ver docs/contexto_hadouken.md)
      AMAZON_PARTNER_TAG: ""
      TIMEZONE: Europe/Madrid
      OFFER_SOURCES: chollometro
      PYTHONUTF8: "1"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar el estado (rama "estado")
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin estado >/dev/null; then
            git fetch --depth=1 origin estado
            git show origin/estado:offers.json > data/offers.json || rm -f data/offers.json
            git show origin/estado:state.json  > data/state.json  || rm -f data/state.json
            echo "Estado recuperado."
          else
            echo "Primera ejecución: sin estado previo."
          fi

      - name: Comprobar Telegram (token y canal, sin publicar)
        if: ${{ env.DRY_RUN == 'false' }}
        run: python main.py --verificar

      - name: Ejecutar el bot (una pasada)
        run: python main.py --ciclo

      - name: Guardar el estado (solo si se ha publicado de verdad)
        if: ${{ always() && env.DRY_RUN == 'false' }}
        run: |
          set -e
          mkdir -p /tmp/estado && cd /tmp/estado
          git init -q -b estado
          cp "$GITHUB_WORKSPACE"/data/*.json . 2>/dev/null || true
          if [ -z "$(ls -A)" ]; then echo "No hay estado que guardar."; exit 0; fi
          git config user.name  "hadouken-bot"
          git config user.email "hadouken-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Estado $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" estado
          echo "Estado guardado en la rama 'estado'."

      - name: Guardar registros (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
