# Hadouken Zone - publicación automática en Telegram (GitHub Actions)
#
# MODO VIGILANCIA (desde la 1.6.0): cada ejecución se queda hasta ~5 h 30 min repitiendo
# "python main.py --ciclo" cada 45 s (scripts/vigilar.sh), en vez de una sola pasada.
#   - En la primera pasada desde las 09:00: buenos días con imagen.
#   - En cada pasada: busca ofertas nuevas en las fuentes (OFFER_SOURCES, por defecto
#     Chollometro) y publica las válidas. Las recién salidas van primero, con 10 s de pausa.
#   - 23:00: hilo de buenas noches. A las 23:35 la vigilancia termina.
#
# El historial, el estado y los hilos ya revisados se guardan en la rama "estado" tras cada
# pasada en la que cambien, para no repetir ofertas ni mensajes entre ejecuciones.
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Disparador principal: cron-job.org lanza este workflow con workflow_dispatch y dry_run=false
#   (ver README). Mientras una vigilancia está en marcha, los lanzamientos nuevos esperan en
#   cola (concurrency) y solo se queda el último: en cuanto termina una, empieza la siguiente.
#   El schedule de abajo es solo respaldo.
# Ejecución manual: pestaña Actions > "Publicar ofertas" > Run workflow
#   (por defecto en DRY_RUN: una sola pasada que muestra el resultado sin publicar).

name: Publicar ofertas

on:
  schedule:
    # En UTC (sin depender de "timezone:"): cubre 09:07-23:07 de Madrid en invierno (UTC+1)
    # y en verano (UTC+2). El bot decide con la hora de Madrid si toca publicar; las pasadas
    # fuera de horario terminan en segundos sin hacer nada.
    - cron: "7,37 7-21 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulación: true = no publica nada en Telegram"
        type: choice
        options: ["true", "false"]
        default: "true"

concurrency:
  group: publicar-ofertas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      # Afiliación desactivada hasta nuevo aviso (ver docs/contexto_hadouken.md)
      AMAZON_PARTNER_TAG: ""
      TIMEZONE: Europe/Madrid
      OFFER_SOURCES: chollometro
      PYTHONUTF8: "1"
      # Vigilancia: en simulación, una sola pasada
      WATCH_MINUTES: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') && '0' || '330' }}
      WATCH_INTERVAL_SECONDS: "45"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar el estado (rama "estado")
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin estado >/dev/null; then
            git fetch --depth=1 origin estado
            git show origin/estado:offers.json > data/offers.json || rm -f data/offers.json
            git show origin/estado:state.json  > data/state.json  || rm -f data/state.json
            git show origin/estado:chollometro_vistos.json > data/chollometro_vistos.json || rm -f data/chollometro_vistos.json
            echo "Estado recuperado."
          else
            echo "Primera ejecución: sin estado previo."
          fi

      - name: Comprobar Telegram (token y canal, sin publicar)
        if: ${{ env.DRY_RUN == 'false' }}
        run: python main.py --verificar

      - name: Vigilar y publicar (pasadas cada 45 s)
        env:
          SAVE_STATE: ${{ env.DRY_RUN == 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/vigilar.sh

      - name: Guardar el estado (solo si se ha publicado de verdad)
        if: ${{ always() && env.DRY_RUN == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/guardar_estado.sh

      - name: Retraso de publicación respecto a la fuente
        if: always()
        run: python main.py --retrasos || true

      - name: Guardar registros (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
