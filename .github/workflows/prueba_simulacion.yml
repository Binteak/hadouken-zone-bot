# TEMPORAL: pasada completa en simulación antes de activar la publicación
name: Prueba simulacion
on: workflow_dispatch
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: "true"
      AMAZON_PARTNER_TAG: ""
      OFFER_SOURCES: chollometro
      OFFER_DELAY_SECONDS: "1"
      MAX_OFFERS_PER_CYCLE: "10"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python main.py --once
