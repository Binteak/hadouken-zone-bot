# TEMPORAL: pasada completa en simulación antes de activar la publicación
name: Prueba simulacion
on: workflow_dispatch
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: "true"
      AMAZON_PARTNER_TAG: ""
      OFFER_SOURCES: chollometro
      OFFER_DELAY_SECONDS: "1"
      MAX_OFFERS_PER_CYCLE: "10"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python main.py --once
      - name: Comprobar datos reales de todas las ofertas de Amazon (sin filtrar plataforma)
        run: |
          python - <<'PY'
          from hadouken_zone.config import Settings
          from hadouken_zone.sources.chollometro import ChollometroSource
          src = ChollometroSource(Settings.from_env())
          for e in src.candidates()[:8]:
              o = src.offer_from_entry(e)
              if o is None:
                  print(f"- {e['thread_id']}: sin datos/ASIN | {e['title'][:60]}")
              else:
                  print(f"- {e['thread_id']}: ASIN={o.asin} | {o.price} € (antes {o.previous_price}) -{o.discount_percent}% | {o.title[:60]}")
          PY
