# Hadouken Zone - tests automáticos en cada cambio de código
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "branding/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest
